[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarea-pbt"
version = "1.0.0"
description = "CRUD en memoria validado con Property-Based Testing"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "hypothesis>=6.100",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
